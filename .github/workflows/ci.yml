name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check version and changelog
        run: node scripts/check-version.mjs ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build extension
        run: npm run build:extension
      - name: Check the extension.json UUID was not regenerated
        run: git diff --exit-code packages/extension/extension.json
      - uses: actions/upload-artifact@v4
        with:
          name: extension-eext
          path: packages/extension/build/dist/*.eext
          if-no-files-found: error
