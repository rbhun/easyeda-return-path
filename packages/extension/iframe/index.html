<!doctype html>
<html lang="en">
	<head>
		<title>Return Path</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<style>
			:root {
				color-scheme: dark;
				--bg: #1e1f22;
				--panel: #2b2d31;
				--line: #3c3f45;
				--text: #e3e5e8;
				--muted: #9aa0a6;
				--accent: #4f8cff;
			}
			* { box-sizing: border-box; }
			body {
				margin: 0;
				padding: 10px;
				background: var(--bg);
				color: var(--text);
				font: 12px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
			}
			h2 {
				margin: 14px 0 6px;
				font-size: 11px;
				font-weight: 600;
				letter-spacing: 0.04em;
				text-transform: uppercase;
				color: var(--muted);
			}
			.row { display: flex; gap: 6px; flex-wrap: wrap; }
			button {
				flex: 1 1 0;
				min-width: 0;
				padding: 6px 8px;
				border: 1px solid var(--line);
				border-radius: 6px;
				background: var(--panel);
				color: var(--text);
				font: inherit;
				cursor: pointer;
			}
			button:hover:not(:disabled) { border-color: var(--accent); }
			button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
			button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
			button:disabled { opacity: 0.45; cursor: default; }
			.status {
				display: flex;
				justify-content: space-between;
				gap: 8px;
				padding: 6px 8px;
				border-radius: 6px;
				background: var(--panel);
				color: var(--muted);
			}
			.status b { color: var(--text); font-weight: 600; }
			#result {
				margin: 0;
				padding: 8px;
				max-height: 220px;
				overflow: auto;
				border: 1px solid var(--line);
				border-radius: 6px;
				background: var(--panel);
				white-space: pre-wrap;
				word-break: break-word;
				font: 11.5px/1.45 ui-monospace, Consolas, monospace;
			}
			#result .warn { color: #ffd166; }
			#result .err, #state.err { color: #ff6b6b; }
			.good { color: #3dd68c; }
			.fair { color: #ffd166; }
			.work { color: #ff6b6b; }
			#score { margin: 0 0 8px; }
			#score .head { font-weight: 600; margin-bottom: 6px; }
			.net {
				margin: 0 0 6px;
				padding: 6px 8px;
				border: 1px solid var(--line);
				border-radius: 6px;
				background: var(--panel);
			}
			.nethead {
				display: flex;
				justify-content: space-between;
				gap: 8px;
				width: 100%;
				padding: 0;
				border: 0;
				background: transparent;
				color: inherit;
				font: inherit;
				text-align: left;
				cursor: pointer;
			}
			.meta { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 4px; color: var(--muted); }
			.meta select { width: auto; }
			.find { margin: 2px 0 0; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
			.find:hover { color: var(--accent); }
			.find .fix { display: block; color: var(--muted); }
			.muted { color: var(--muted); }
			table { width: 100%; border-collapse: collapse; }
			td { padding: 3px 0; vertical-align: middle; }
			td.label { padding-right: 6px; }
			td.label.off { opacity: 0.45; }
			input[type="checkbox"] { margin: 0 6px 0 0; accent-color: #5b9cff; }
			td.ctl { width: 1%; white-space: nowrap; }
			select, input[type="number"] {
				padding: 3px 4px;
				border: 1px solid var(--line);
				border-radius: 4px;
				background: var(--panel);
				color: var(--text);
				font: inherit;
			}
			input[type="number"] { width: 46px; }
			select { width: 132px; text-overflow: ellipsis; }
			.swatch {
				display: inline-block;
				width: 18px;
				height: 0;
				margin-right: 6px;
				vertical-align: middle;
				border-top-style: solid;
			}
		</style>
	</head>
	<body>
		<div class="status" role="status" aria-live="polite">
			<span id="state">Connecting to the extension…</span>
			<span id="version" class="muted"></span>
		</div>

		<h2>Result</h2>
		<div id="score"></div>
		<pre id="result" class="muted">No result yet.</pre>

		<h2>Analyse</h2>
		<div class="row">
			<button id="hf" class="primary" title="High-frequency return path of the selected signal net: select a track, via or pad first; the driver question opens in the wizard window">HF check</button>
			<button id="dc" class="primary" title="DC return current of a power rail, with the wizard">DC check…</button>
		</div>
		<div class="row" style="margin-top: 6px">
			<button id="rerun" title="Read the board again and repeat the last analysis, without the wizard">Rerun last</button>
			<button id="trace" title="The check that fits the selected track, via or pad: HF for a signal net, DC for a power rail. With a pad or part selected, DC shows only that part's current. While an analysis runs, this button cancels it.">Selected trace</button>
		</div>
		<p id="lastRun" class="muted" style="margin: 6px 0 0"></p>

		<h2>Overlay</h2>
		<div class="row">
			<button id="toggle">Hide</button>
			<button id="clear" title="Removes every Return Path marker on the board, also ones left by an earlier session or version">Clear</button>
		</div>

		<h2>Lines: show, colour, width</h2>
		<table id="styles"><tbody></tbody></table>
		<div class="row" style="margin-top: 6px">
			<button id="reset">Reset to defaults</button>
		</div>

		<script>
			(function () {
				var api = window.eda || (window.parent && window.parent.eda);
				var COMMAND = 'returnpath.panel.command';
				var STATE = 'returnpath.panel.state';
				var MAILBOX = 'returnpath.panel.mailbox';
				var CSS = { red: '#ff0000', yellow: '#ffff00', green: '#00ff00', cyan: '#00ffff', blue: '#0000ff', magenta: '#ff00ff', white: '#ffffff' };
				var $ = function (id) { return document.getElementById(id); };
				var last = null;

				function send(message) {
					if (!api || !api.sys_MessageBus) return;
					api.sys_MessageBus.publish(COMMAND, message);
				}

				var newest = null;
				var stampOf = function (snap, k) { return snap && snap.fields && snap.fields[k] ? snap.fields[k].at : -1; };
				function stale(s) {
					if (!newest || !s.stamps) return false;
					return ['result', 'overlayOwner', 'lastRun'].some(function (k) { return stampOf(newest, k) > s.stamps[k]; });
				}

				var ACTIONS = ['hf', 'dc', 'rerun', 'toggle', 'clear', 'trace'];
				function showError(text) {
					$('state').textContent = text;
					$('state').className = 'err';
					ACTIONS.forEach(function (id) { $(id).disabled = false; });
					$('trace').textContent = 'Selected trace';
				}

				var heard = false;
				function render(s) {
					heard = true;
					try {
						if (s && s.error) {
							last = null;
							if (s.version) $('version').textContent = 'v' + s.version;
							showError('Panel error: ' + s.error + '. Details: Return Path > Show Saved Log.');
							return;
						}
						draw(s);
					} catch (e) {
						last = null;
						showError('Panel error: ' + (e && e.message ? e.message : String(e)) + '. The buttons still work; please send Return Path > Show Saved Log.');
						if (window.console) console.error('[ReturnPath] panel page:', e);
					}
				}

				function draw(s) {
					last = s;
					$('state').className = '';
					// After this state is drawn, so a reply delivered at once is not drawn over.
					if (stale(s)) setTimeout(function () { send({ cmd: 'adopt', snapshot: newest }); }, 0);
					$('version').textContent = 'v' + s.version;
					$('state').innerHTML = s.busy ? 'Running: <b></b>' : 'Overlay: <b></b>';
					$('state').querySelector('b').textContent = s.busy || (s.leftover ? 'left by v' + s.leftover : { none: 'none', shown: 'shown', hidden: 'hidden' }[s.overlay]);
					['hf', 'dc', 'rerun', 'toggle', 'clear'].forEach(function (id) { $(id).disabled = !!s.busy; });
					$('trace').textContent = s.busy ? 'Cancel' : 'Selected trace';
					var sel = s.selection;
					$('rerun').textContent = sel ? (sel.kind === 'pad' ? 'Rerun for single pad' : 'Rerun for single part') : 'Rerun last';
					$('rerun').title = sel
						? 'Focus on ' + sel.label + ': solve and draw only the current of that part (on a signal pad: the HF check of its net)'
						: 'Read the board again and repeat the last analysis, without the wizard';
					$('rerun').disabled = !!s.busy || (!s.lastRun && !sel);
					$('toggle').disabled = !!s.busy || s.overlay === 'none';
					$('toggle').textContent = s.overlay === 'hidden' ? 'Show' : 'Hide';
					// Markers drawn before an update are not always known here, so Clear stays available.
					$('clear').disabled = !!s.busy;
					$('lastRun').textContent = s.lastRun ? 'Last: ' + s.lastRun : '';

					drawScore(s.result && s.result.score);
					var pre = $('result');
					pre.textContent = '';
					if (s.result) {
						pre.classList.remove('muted');
						var head = document.createElement('div');
						head.className = 'muted';
						head.textContent = s.result.title + ' · ' + s.result.at;
						pre.appendChild(head);
						s.result.lines.forEach(function (line) {
							var div = document.createElement('div');
							if (/^warning:|\[warn/i.test(line)) div.className = 'warn';
							if (/^\[(error|fail)/i.test(line)) div.className = 'err';
							div.textContent = line;
							pre.appendChild(div);
						});
					} else {
						pre.classList.add('muted');
						pre.textContent = 'No result yet.';
					}

					var body = $('styles').tBodies[0];
					body.textContent = '';
					s.roles.forEach(function (r) {
						var tr = document.createElement('tr');
						var show = document.createElement('td');
						show.className = 'ctl';
						var box = document.createElement('input');
						box.type = 'checkbox';
						box.checked = r.visible !== false;
						box.title = 'Show or hide';
						box.setAttribute('aria-label', 'Show ' + r.label);
						box.onchange = function () { change(r.role, { visible: box.checked }); };
						show.appendChild(box);
						var label = document.createElement('td');
						label.className = 'label' + (r.visible === false ? ' off' : '');
						var sw = document.createElement('span');
						sw.className = 'swatch';
						sw.style.borderTopColor = CSS[r.colour];
						sw.style.borderTopWidth = Math.max(1, r.width) + 'px';
						label.appendChild(sw);
						label.appendChild(document.createTextNode(r.label));
						var colour = document.createElement('td');
						colour.className = 'ctl';
						var sel = document.createElement('select');
						sel.setAttribute('aria-label', r.label + ' colour');
						s.palette.forEach(function (name) {
							var o = document.createElement('option');
							o.value = name;
							o.textContent = r.role === 'returnInner' && name === s.innerCycle[0] && s.innerCycle.length > 1 ? name + ' / ' + s.innerCycle.slice(1).join(' / ') + ' by layer' : name;
							if (name === r.colour) o.selected = true;
							sel.appendChild(o);
						});
						sel.onchange = function () { change(r.role, { colour: sel.value }); };
						colour.appendChild(sel);
						var width = document.createElement('td');
						width.className = 'ctl';
						var num = document.createElement('input');
						num.type = 'number';
						num.min = '1';
						num.max = '10';
						num.step = '1';
						num.value = String(r.width);
						num.setAttribute('aria-label', r.label + ' width');
						num.onchange = function () {
							var v = Math.round(Number(num.value));
							if (v >= 1 && v <= 10) change(r.role, { width: v });
						};
						width.appendChild(num);
						tr.appendChild(show);
						tr.appendChild(label);
						tr.appendChild(colour);
						tr.appendChild(width);
						body.appendChild(tr);
					});
				}

				function statusClass(status) {
					return status === 'Good' ? 'good' : status === 'Fair' ? 'fair' : 'work';
				}

				function zoom(at) {
					if (at) send({ cmd: 'zoom', at: { x: at.x, y: at.y } });
				}

				function lineButton(text, at, fix) {
					var b = document.createElement('button');
					b.className = 'find';
					b.appendChild(document.createTextNode(text));
					if (fix) {
						var s = document.createElement('span');
						s.className = 'fix';
						s.textContent = fix;
						b.appendChild(s);
					}
					b.onclick = function () { zoom(at); };
					return b;
				}

				function drawScore(score) {
					var box = $('score');
					box.textContent = '';
					if (!score || !score.rows) return;
					var head = document.createElement('div');
					head.className = 'head ' + statusClass(score.status);
					head.textContent = score.header;
					box.appendChild(head);
					score.rows.forEach(function (row, i) {
						var card = document.createElement('div');
						card.className = 'net';
						var open = i === 0;
						var btn = document.createElement('button');
						btn.className = 'nethead';
						var name = document.createElement('span');
						name.textContent = row.net + (row.driver ? ' · ' + row.driver : '');
						var mark = document.createElement('b');
						mark.className = statusClass(row.status);
						mark.textContent = row.score + ' ' + row.status;
						btn.appendChild(name);
						btn.appendChild(mark);
						var body = document.createElement('div');
						var meta = document.createElement('div');
						meta.className = 'meta';
						function pick(kind, value, options) {
							var sel = document.createElement('select');
							sel.setAttribute('aria-label', row.net + ' ' + kind);
							options.forEach(function (o) {
								var opt = document.createElement('option');
								opt.value = o[0];
								opt.textContent = o[1];
								if (o[0] === value) opt.selected = true;
								sel.appendChild(opt);
							});
							sel.onchange = function () {
								var msg = { cmd: 'netprop', net: row.net };
								msg[kind] = sel.value;
								send(msg);
							};
							return sel;
						}
						meta.appendChild(pick('edge', row.edge, [['fast', 'Fast'], ['normal', 'Normal'], ['slow', 'Slow']]));
						meta.appendChild(pick('drive', row.drive, [['push-pull', 'Push-pull'], ['open-drain', 'Open-drain']]));
						var nums = document.createElement('span');
						nums.textContent = row.lengthMm.toFixed(1) + ' mm · r ' + row.r.toFixed(2) + ' · r_w ' + row.rW.toFixed(2);
						meta.appendChild(nums);
						body.appendChild(meta);
						(row.also || []).forEach(function (a) {
							var other = document.createElement('div');
							other.className = 'muted';
							other.textContent = 'Other end ' + a.driver + ': ' + a.score + '/100.';
							body.appendChild(other);
						});
						(row.points || []).forEach(function (p) {
							body.appendChild(lineButton('-' + p.points + '  ' + p.text, p.at, p.fix));
						});
						(row.findings || []).forEach(function (f) {
							body.appendChild(lineButton(f.grade + ' ' + f.type + ' ' + f.value + ' — ' + f.text, f.at));
						});
						body.hidden = !open;
						btn.onclick = function () { body.hidden = !body.hidden; };
						card.appendChild(btn);
						card.appendChild(body);
						box.appendChild(card);
					});
				}

				function change(role, patch) {
					var style = {};
					style[role] = patch;
					send({ cmd: 'style', style: style });
				}

				['hf', 'dc', 'rerun', 'toggle', 'clear'].forEach(function (id) {
					$(id).onclick = function () { send({ cmd: id }); };
				});
				$('trace').onclick = function () { send({ cmd: last && last.busy ? 'cancel' : 'trace' }); };
				$('reset').onclick = function () { send({ cmd: 'resetStyle' }); };

				if (!api || !api.sys_MessageBus) {
					$('state').textContent = 'This window cannot reach the EasyEDA API. Send the saved log (Return Path > Show Saved Log...).';
					return;
				}
				api.sys_MessageBus.subscribe(STATE, render);
				send({ cmd: 'hello' });
				// Results of analyses run while this window was closed, or by an instance that has gone,
				// wait in the mailbox; each is handed to the extension, which shows the newest.
				if (typeof api.sys_MessageBus.pullAsync === 'function') {
					(function pull() {
						api.sys_MessageBus.pullAsync(MAILBOX).then(function (snapshot) {
							if (snapshot && (!newest || ['result', 'overlayOwner', 'lastRun'].some(function (k) { return stampOf(snapshot, k) > stampOf(newest, k); }))) newest = snapshot;
							if (snapshot) send({ cmd: 'adopt', snapshot: snapshot });
							pull();
						}, function () { setTimeout(pull, 1000); });
					})();
				}
				setTimeout(function () {
					if (!heard) $('state').textContent = 'No answer from the extension yet. Reopen the panel with Return Path > Open Panel...';
				}, 3000);
			})();
		</script>
	</body>
</html>
